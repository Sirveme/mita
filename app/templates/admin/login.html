<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - MITA</title>
    <link rel="stylesheet" href="/static/css/colors_roles.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0A0E1A 0%, #1A2332 50%, #2A3647 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .login-container {
            width: 100%;
            max-width: 450px;
            background: linear-gradient(135deg, var(--dark-blue) 0%, var(--medium-blue) 100%);
            border-radius: 20px;
            padding: 3rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            border: 2px solid var(--admin-primary);
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo {
            width: 80px;
            height: 80px;
            background: var(--admin-primary);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            font-size: 2.5rem;
            color: var(--white);
        }

        .login-header h1 {
            font-size: 1.75rem;
            color: var(--white);
            margin-bottom: 0.5rem;
        }

        .login-header p {
            color: var(--text-gray);
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            color: var(--text-light);
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-gray);
            font-size: 1.125rem;
        }

        .form-input {
            width: 100%;
            padding: 1rem 1rem 1rem 3rem;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: var(--white);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--admin-primary);
        }

        .form-input::placeholder {
            color: var(--text-gray);
        }

        .btn-login {
            width: 100%;
            padding: 1rem;
            background: var(--admin-gradient);
            color: var(--white);
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: var(--admin-shadow);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .alert {
            padding: 1rem;
            border-radius: 10px;
            margin-bottom: 1.5rem;
            display: none;
        }

        .alert.show {
            display: block;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.2);
            border: 2px solid var(--danger);
            color: #FCA5A5;
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.2);
            border: 2px solid var(--success);
            color: #6EE7B7;
        }

        .login-footer {
            text-align: center;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .login-footer a {
            color: var(--admin-primary);
            text-decoration: none;
            font-weight: 600;
        }

        .login-footer a:hover {
            text-decoration: underline;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 1rem;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 3px solid rgba(139, 92, 246, 0.3);
            border-top-color: var(--admin-primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-header">
            <div class="logo">
                <i class="fas fa-crown"></i>
            </div>
            <h1>Admin Panel</h1>
            <p>Inicia sesión para acceder al panel de administración</p>
        </div>

        <div class="alert alert-error" id="errorAlert"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="celular">Número de celular</label>
                <div class="input-wrapper">
                    <i class="fas fa-phone input-icon"></i>
                    <input 
                        type="text" 
                        id="celular" 
                        class="form-input" 
                        placeholder="999888777"
                        maxlength="9"
                        required
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock input-icon"></i>
                    <input 
                        type="password" 
                        id="password" 
                        class="form-input" 
                        placeholder="••••••••"
                        required
                    >
                </div>
            </div>

            <button type="submit" class="btn-login" id="btnLogin">
                <i class="fas fa-sign-in-alt" style="margin-right: 0.5rem;"></i>
                Iniciar Sesión
            </button>
        </form>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="color: var(--text-gray); margin-top: 1rem;">Iniciando sesión...</p>
        </div>

        <div class="login-footer">
            <p style="color: var(--text-gray); margin-bottom: 0.5rem;">¿Olvidaste tu contraseña?</p>
            <a href="/recuperar-password">Recuperar contraseña</a>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script>
        const loginForm = document.getElementById('loginForm');
        const btnLogin = document.getElementById('btnLogin');
        const loading = document.getElementById('loading');
        const errorAlert = document.getElementById('errorAlert');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const celular = document.getElementById('celular').value;
            const password = document.getElementById('password').value;

            // Validaciones básicas
            if (celular.length !== 9) {
                mostrarError('El celular debe tener 9 dígitos');
                return;
            }

            // Mostrar loading
            btnLogin.disabled = true;
            loading.classList.add('show');
            errorAlert.classList.remove('show');

            try {
                // Llamar al API
                const response = await fetch('/api/v1/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        celular: celular,
                        password: password
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    // Verificar que sea admin
                    if (data.usuario.rol !== 'admin') {
                        mostrarError('Acceso denegado. Solo administradores pueden acceder.');
                        btnLogin.disabled = false;
                        loading.classList.remove('show');
                        return;
                    }

                    // Guardar tokens
                    localStorage.setItem('token', data.access_token);
                    localStorage.setItem('refresh_token', data.refresh_token);
                    localStorage.setItem('usuario', JSON.stringify(data.usuario));

                    // Verificar si es primer login
                    if (data.usuario.primer_login) {
                        // Redirigir a cambiar contraseña
                        window.location.href = '/admin/cambiar-password';
                    } else {
                        // Redirigir a dashboard
                        window.location.href = '/admin/dashboard';
                    }

                } else {
                    mostrarError(data.detail || 'Error al iniciar sesión');
                    btnLogin.disabled = false;
                    loading.classList.remove('show');
                }

            } catch (error) {
                console.error('Error:', error);
                mostrarError('Error de conexión. Inténtalo de nuevo.');
                btnLogin.disabled = false;
                loading.classList.remove('show');
            }
        });

        function mostrarError(mensaje) {
            errorAlert.textContent = mensaje;
            errorAlert.classList.add('show');
        }
    </script>
</body>
</html>
