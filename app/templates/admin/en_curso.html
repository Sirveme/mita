<!doctype html>
<html lang="es-PE">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MITA · Servicios en curso</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #0e0e1a; color: #e9edef; font-family: system-ui, 'Segoe UI', sans-serif; padding: 24px 16px 48px; }
        .wrap { max-width: 980px; margin: 0 auto; }
        h1 { font-size: 20px; margin: 0 0 4px; }
        h2 { font-size: 15px; color: #c9bfe0; margin: 26px 0 10px; }
        .sub { color: #8a8a9a; font-size: 14px; margin: 0 0 16px; }
        .card { background: #12101a; border: 1px solid #2a2a4e; border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
        .card.alerta { border-color: #ff6b6b; }
        .card.revisar { border-color: #d4af37; }
        .row { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: baseline; }
        .pill { padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; }
        .en-camino { background: rgba(212,175,55,.15); color: #d4af37; } .en-sitio { background: rgba(34,197,94,.15); color: #22c55e; }
        .al { background: rgba(255,107,107,.14); color: #ff6b6b; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; margin-right: 6px; }
        .meta { color: #8a8a9a; font-size: 13px; margin-top: 6px; }
        .vacio { color: #8a8a9a; padding: 22px; text-align: center; }
        button { background: #181830; color: #e9edef; border: 1px solid #2a2a4e; border-radius: 9px; padding: 6px 11px; font-weight: 700; cursor: pointer; font-size: 12px; margin-top: 8px; }
        .monto { font-weight: 800; }
        .msg { margin: 8px 0; font-size: 13px; color: #22c55e; min-height: 16px; }
    </style>
</head>
<body>
    <div class="wrap">
        <h1>Servicios en curso</h1>
        <p class="sub">Técnicos en camino y en sitio, con ETA, última ubicación y alertas. La torre puede escribir en el chat como MITA.</p>
        <div class="msg" id="msg"></div>

        <h2>En camino / en sitio</h2>
        <div id="curso"><p class="vacio">Cargando…</p></div>

        <h2>Presupuestos</h2>
        <div id="presu"><p class="vacio">Cargando…</p></div>
    </div>
    <script>
        const AL = { sin_ubicacion_10min: 'Sin ubicación +10 min', eta_mas_15: 'ETA +15 min', cliente_no_esta: 'El cliente no está' };
        const msg = (t) => document.getElementById('msg').textContent = t || '';
        const money = (v) => v == null ? '—' : 'S/ ' + Number(v).toFixed(2);
        function hace(seg){ if (seg == null) return 'sin datos'; if (seg < 60) return 'hace ' + seg + ' s'; return 'hace ' + Math.round(seg/60) + ' min'; }

        async function cargarCurso(){
            const cont = document.getElementById('curso');
            let rows; try { const r = await fetch('/api/v1/admin/en-curso'); if(!r.ok){ cont.innerHTML='<p class="vacio">No autorizado.</p>'; return; } rows = await r.json(); } catch(e){ return; }
            if (!rows.length){ cont.innerHTML = '<p class="vacio">Nadie en camino ni en sitio ahora.</p>'; return; }
            cont.innerHTML = rows.map(s => {
                const al = (s.alertas || []).map(a => `<span class="al">⚠ ${AL[a] || a}</span>`).join('');
                const cls = s.alertas && s.alertas.length ? 'alerta' : '';
                const badge = s.estado === 'EN_SITIO' ? 'en-sitio' : 'en-camino';
                return `<div class="card ${cls}"><div class="row">`+
                    `<b>Solicitud #${s.solicitud_id}</b> <span class="pill ${badge}">${s.estado}</span>`+
                    `<span>Técnico ${s.tecnico_id ?? '—'}</span>`+
                    `<span>ETA ${s.eta_actual ?? '—'} min (inicial ${s.eta_inicial ?? '—'})</span></div>`+
                    `<div class="meta">Última ubicación: ${hace(s.ubicacion_hace_seg)}</div>`+
                    (al ? `<div style="margin-top:8px;">${al}</div>` : '')+
                    `<button onclick="escribir(${s.solicitud_id})">Escribir como MITA</button></div>`;
            }).join('');
        }
        async function cargarPresu(){
            const cont = document.getElementById('presu');
            let d; try { const r = await fetch('/api/v1/admin/presupuestos'); if(!r.ok){ cont.innerHTML='<p class="vacio">No autorizado.</p>'; return; } d = await r.json(); } catch(e){ return; }
            const rows = d.presupuestos || [];
            if (!rows.length){ cont.innerHTML = '<p class="vacio">Sin presupuestos todavía.</p>'; return; }
            cont.innerHTML = rows.map(p => {
                const cls = p.revisar ? 'revisar' : (p.reemplazado ? '' : '');
                const flags = [p.revisar ? `<span class="al" style="background:rgba(212,175,55,.15);color:#d4af37">Revisar &gt; ${money(d.umbral)}</span>` : '',
                               p.reemplazado ? '<span class="al" style="background:#181830;color:#8a8a9a">reemplazada</span>' : ''].join('');
                return `<div class="card ${cls}"><div class="row">`+
                    `<b>Solicitud #${p.solicitud_id}</b> <span>v${p.version}</span> <span class="pill en-camino">${p.estado}</span>`+
                    `<span class="monto">${p.requiere_reparacion ? money(p.monto) : 'sin reparación'}</span> ${flags}</div>`+
                    `<div class="meta">${(p.diagnostico||'').replace(/</g,'&lt;')}</div></div>`;
            }).join('');
        }
        async function escribir(sid){
            const texto = prompt('Mensaje para el chat (se publica como MITA):');
            if (!texto) return;
            const r = await fetch('/api/v1/servicios/'+sid+'/chat?rol=mita',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tipo:'texto',contenido:texto})});
            msg(r.ok ? 'Mensaje enviado como MITA ✓' : 'No se pudo enviar');
        }
        window.escribir = escribir;
        function refrescar(){ cargarCurso(); cargarPresu(); }
        refrescar(); setInterval(refrescar, 8000);
    </script>
</body>
</html>
