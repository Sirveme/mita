<!doctype html>
<html lang="es-PE">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MITA · Estado del sistema</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #0e0e1a; color: #e9edef; font-family: system-ui, 'Segoe UI', sans-serif; padding: 24px 16px 48px; }
        .wrap { max-width: 760px; margin: 0 auto; }
        h1 { font-size: 20px; margin: 0 0 4px; }
        .sub { color: #8a8a9a; font-size: 14px; margin: 0 0 16px; }
        .item { background: #12101a; border: 1px solid #2a2a4e; border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; display: flex; gap: 14px; align-items: flex-start; }
        .item.ok { border-color: #22c55e44; } .item.bad { border-color: #ff6b6b55; }
        .dot { font-size: 20px; line-height: 1.3; }
        .dot.ok { color: #22c55e; } .dot.bad { color: #ff6b6b; } .dot.warn { color: #d4af37; }
        .body b { font-size: 15px; } .body .det { color: #c9bfe0; font-size: 13px; margin-top: 3px; }
        .body .falta { color: #ff8f8f; font-size: 13px; margin-top: 4px; }
        .vacio { color: #8a8a9a; text-align: center; padding: 20px; }
    </style>
</head>
<body>
    <div class="wrap">
        <h1>Estado del sistema</h1>
        <p class="sub">Integraciones y configuración. ✓ listo · ✗ falta algo. No se muestran secretos.</p>
        <div id="lista"><p class="vacio">Cargando…</p></div>
    </div>
    <script>
        const NOMBRES = {
            entorno: 'Entorno de producción', pagook: 'PagoOK (validación de pagos)',
            qr: 'QR Yape/Plin (número e imagen)', facturalo: 'Facturalo (comprobantes)',
            google_maps: 'Google Maps', vapid: 'Avisos push (VAPID)',
            tarea_fondo: 'Tarea de fondo', whatsapp: 'WhatsApp de avisos'
        };
        const ORDEN = ['entorno', 'pagook', 'qr', 'facturalo', 'google_maps', 'vapid', 'tarea_fondo', 'whatsapp'];
        async function cargar() {
            let d; try { const r = await fetch('/api/v1/admin/estado'); if (!r.ok) { document.getElementById('lista').innerHTML = '<p class="vacio">No autorizado.</p>'; return; } d = await r.json(); } catch (e) { return; }
            document.getElementById('lista').innerHTML = ORDEN.map(k => {
                const it = d[k]; if (!it) return '';
                const extra = [];
                if (k === 'facturalo' && it.ping != null) extra.push('ping: ' + (it.ping ? 'OK' : 'sin respuesta'));
                if (k === 'facturalo') extra.push('modo: ' + (it.modo || '—'));
                if (k === 'google_maps') extra.push('servidor: ' + (it.servidor ? 'sí' : 'no'));
                if (k === 'qr' && it.titular) extra.push('titular configurado');
                if (k === 'entorno' && it.demo_auth) extra.push('⚠ DEMO_AUTH activo');
                const dotc = it.ok ? 'ok' : (k === 'pagook' || k === 'whatsapp' ? 'warn' : 'bad');
                return `<div class="item ${it.ok ? 'ok' : 'bad'}">
                    <div class="dot ${dotc}">${it.ok ? '✓' : (dotc === 'warn' ? '⚠' : '✗')}</div>
                    <div class="body"><b>${NOMBRES[k] || k}</b>
                        <div class="det">${(it.detalle || '').replace(/</g, '&lt;')}${extra.length ? ' · ' + extra.join(' · ') : ''}</div>
                        ${!it.ok && it.falta ? `<div class="falta">${(it.falta || '').replace(/</g, '&lt;')}</div>` : ''}
                    </div></div>`;
            }).join('');
        }
        cargar(); setInterval(cargar, 15000);
    </script>
</body>
</html>
