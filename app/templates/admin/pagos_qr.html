<!doctype html>
<html lang="es-PE">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MITA · Pagos QR (torre de control)</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #0e0e1a; color: #e9edef; font-family: system-ui, 'Segoe UI', sans-serif; padding: 24px 16px 48px; }
        .wrap { max-width: 1000px; margin: 0 auto; }
        h1 { font-size: 20px; margin: 0 0 4px; }
        .sub { color: #8a8a9a; font-size: 14px; margin: 0 0 16px; }
        .card { background: #12101a; border: 1px solid #2a2a4e; border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
        .row { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: baseline; }
        .pill { padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; }
        .media { background: rgba(212,175,55,.15); color: #d4af37; } .verif { background: rgba(138,138,154,.15); color: #8a8a9a; }
        .conf { background: rgba(255,107,107,.14); color: #ff6b6b; } .reuso { background: rgba(255,107,107,.14); color: #ff6b6b; }
        .cand { background: #181830; border: 1px solid #2a2a4e; border-radius: 10px; padding: 8px 10px; margin-top: 6px; font-size: 13px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        button { background: #22c55e; color: #06210f; border: none; border-radius: 9px; padding: 7px 12px; font-weight: 700; cursor: pointer; font-size: 12px; }
        .vacio { color: #8a8a9a; padding: 22px; text-align: center; }
        .msg { margin: 10px 0; font-size: 13px; color: #22c55e; min-height: 16px; }
        small { color: #8a8a9a; }
    </style>
</head>
<body>
    <div class="wrap">
        <h1>Pagos QR — torre de control</h1>
        <p class="sub">Pagos en verificación, nivel medio (elige el candidato) y conflictos.</p>
        <div class="msg" id="msg"></div>
        <div id="lista"><p class="vacio">Cargando…</p></div>
    </div>
    <script>
        const msg = (t) => document.getElementById('msg').textContent = t || '';
        function cand(ps, c) {
            const nombre = c.contraparte || '—', hora = c.fecha_hora || '', dif = (c.diferencia_minutos != null ? c.diferencia_minutos + ' min' : '');
            return `<div class="cand"><span>${nombre} · S/ ${c.monto} · ${c.canal || ''} ${c.codigo_operacion ? '· op ' + c.codigo_operacion : ''} <small>${hora} ${dif}</small></span>` +
                `<button onclick="usar(${ps.id}, ${c.pago_id})">Usar este pago</button></div>`;
        }
        async function cargar() {
            const r = await fetch('/api/v1/pagos-qr/admin/pendientes');
            const cont = document.getElementById('lista');
            if (!r.ok) { cont.innerHTML = '<p class="vacio">No autorizado.</p>'; return; }
            const rows = await r.json();
            if (!rows.length) { cont.innerHTML = '<p class="vacio">No hay pagos pendientes.</p>'; return; }
            cont.innerHTML = rows.map(p => {
                const clsp = p.estado === 'media_pendiente' ? 'media' : (p.estado === 'conflicto' ? 'conf' : 'verif');
                let body = '';
                if (p.estado === 'media_pendiente' && p.candidatos.length) body = p.candidatos.map(c => cand(p, c)).join('');
                else if (p.estado === 'media_pendiente') body = '<small>Sin candidatos en la última consulta.</small>';
                const reuso = p.posible_reuso ? '<span class="pill reuso">posible voucher reutilizado</span>' : '';
                return `<div class="card"><div class="row">` +
                    `<b>Solicitud #${p.solicitud_id}</b> <span class="pill ${clsp}">${p.estado}${p.nivel ? ' · ' + p.nivel : ''}</span> ${reuso}` +
                    `<span>S/ ${p.monto} · ${p.canal || ''}</span> <span>Titular declara: <b>${p.titular_declarado || '—'}</b></span>` +
                    (p.contraparte ? `<span>Pagó: <b>${p.contraparte}</b></span>` : '') +
                    (p.comprobante_estado ? `<small>comprobante: ${p.comprobante_estado}</small>` : '') +
                    `</div>${body}</div>`;
            }).join('');
        }
        async function usar(psId, pagoId) {
            msg('Marcando…');
            try {
                const r = await fetch('/api/v1/pagos-qr/admin/usar', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pago_solicitud_id: psId, pago_id: pagoId })
                });
                const d = await r.json().catch(() => ({}));
                msg(r.ok ? 'Pago confirmado ✓' : ('No se pudo: ' + (d.detail || r.status)));
            } catch (e) { msg('Error de red.'); }
            cargar();
        }
        cargar(); setInterval(cargar, 12000);
    </script>
</body>
</html>
