<!doctype html>
<html lang="es-PE">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MITA · Buscando técnico</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #0e0e1a; color: #e9edef; font-family: system-ui, 'Segoe UI', sans-serif; padding: 24px 16px 48px; }
        .wrap { max-width: 920px; margin: 0 auto; }
        h1 { font-size: 20px; margin: 0 0 4px; }
        .sub { color: #8a8a9a; font-size: 14px; margin: 0 0 16px; }
        .card { background: #12101a; border: 1px solid #2a2a4e; border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
        .card.alerta { border-color: #d4af37; }
        .row { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: baseline; }
        .pill { padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; }
        .busc { background: rgba(212,175,55,.15); color: #d4af37; } .sin { background: rgba(255,107,107,.14); color: #ff6b6b; }
        .crono { font-variant-numeric: tabular-nums; font-weight: 700; color: #e9edef; }
        .tecs { margin-top: 8px; font-size: 13px; color: #c9bfe0; }
        button { background: #22c55e; color: #06210f; border: none; border-radius: 9px; padding: 7px 12px; font-weight: 700; cursor: pointer; font-size: 12px; margin-top: 8px; }
        .ghost { background: #181830; color: #e9edef; border: 1px solid #2a2a4e; }
        .vacio { color: #8a8a9a; padding: 22px; text-align: center; }
        .msg { margin: 10px 0; font-size: 13px; color: #22c55e; min-height: 16px; }
        input { padding: 7px 10px; border-radius: 8px; border: 1px solid #2a2a4e; background: #151520; color: #e9edef; width: 90px; }
    </style>
</head>
<body>
    <div class="wrap">
        <h1>Buscando técnico</h1>
        <p class="sub">Cronómetro desde la difusión, ofertas, vistas y respuestas por técnico. <span id="chequeo" style="color:#8a8a9a"></span></p>
        <div class="msg" id="msg"></div>
        <div id="lista"><p class="vacio">Cargando…</p></div>
    </div>
    <script>
        const msg = (t) => document.getElementById('msg').textContent = t || '';
        function crono(seg) { if (seg == null) return '—'; const m = Math.floor(seg / 60), s = seg % 60; return `${m}:${String(s).padStart(2, '0')}`; }
        async function cargar() {
            const r = await fetch('/api/v1/admin/buscando');
            const cont = document.getElementById('lista');
            if (!r.ok) { cont.innerHTML = '<p class="vacio">No autorizado.</p>'; return; }
            const rows = await r.json();
            if (!rows.length) { cont.innerHTML = '<p class="vacio">Nada buscando técnico ahora.</p>'; return; }
            cont.innerHTML = rows.map(s => {
                const sin = s.estado === 'SIN_TECNICO';
                const resumen = `enviadas ${s.enviadas} · vistas ${s.vistas} · aceptada ${s.respuestas.aceptada} · no puedo ${s.respuestas.no_puedo} · tomada ${s.respuestas.tomada_por_otro}`;
                const alerta = (s.segundos_buscando && s.segundos_buscando >= 300) || sin;
                return `<div class="card ${alerta ? 'alerta' : ''}"><div class="row">` +
                    `<b>Solicitud #${s.solicitud_id}</b> <span class="pill ${sin ? 'sin' : 'busc'}">${s.estado}</span>` +
                    `<span class="crono">⏱ ${crono(s.segundos_buscando)}</span>` +
                    `<span>${s.especialidad || ''} · ${s.distrito || ''}</span></div>` +
                    `<div class="tecs">${resumen}</div>` +
                    `<div>` +
                    `<button onclick="reenviar(${s.solicitud_id})">Reenviar a técnicos</button> ` +
                    `<input id="t-${s.solicitud_id}" placeholder="ID técnico"> ` +
                    `<button class="ghost" onclick="ofrecer(${s.solicitud_id})">Ofrecer a un técnico</button> ` +
                    `<button class="ghost" onclick="cancelar(${s.solicitud_id})">Cancelar solicitud</button>` +
                    `</div></div>`;
            }).join('');
        }
        async function post(url, body) { const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }); const d = await r.json().catch(() => ({})); return { ok: r.ok, d }; }
        async function reenviar(id) { msg('Reenviando…'); const { ok, d } = await post('/api/v1/admin/buscando/reenviar', { solicitud_id: id }); msg(ok ? `Reenviado a ${d.tecnicos} técnico(s) ✓` : 'Error'); cargar(); }
        async function ofrecer(id) { const tid = document.getElementById('t-' + id).value; if (!tid) { msg('Pon el ID del técnico.'); return; } const { ok } = await post('/api/v1/admin/buscando/ofrecer', { solicitud_id: id, tecnico_id: Number(tid) }); msg(ok ? 'Ofrecido ✓' : 'Error'); cargar(); }
        async function cancelar(id) { const motivo = prompt('Motivo de cancelación:'); if (motivo == null) return; const { ok } = await post('/api/v1/admin/buscando/cancelar', { solicitud_id: id, motivo }); msg(ok ? 'Cancelada ✓ (la devolución del dinero es manual)' : 'Error'); cargar(); }
        async function chequeo() {
            try { const d = await (await fetch('/api/v1/admin/ultimo-chequeo')).json();
                document.getElementById('chequeo').textContent = d.hace_seg != null ? `· Último chequeo de tiempos: hace ${d.hace_seg} s` : '· Chequeo de tiempos: aún no corre'; } catch (e) {}
        }
        cargar(); chequeo(); setInterval(cargar, 5000); setInterval(chequeo, 10000);
    </script>
</body>
</html>
