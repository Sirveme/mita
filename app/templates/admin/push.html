<!doctype html>
<html lang="es-PE">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MITA · Avisos (admin)</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #0e0e1a; color: #e9edef; font-family: system-ui, 'Segoe UI', sans-serif; padding: 24px 16px 48px; }
        .wrap { max-width: 1040px; margin: 0 auto; }
        h1 { font-size: 20px; margin: 0 0 4px; }
        h2 { font-size: 14px; color: #8a8a9a; margin: 24px 0 10px; text-transform: uppercase; letter-spacing: .04em; }
        .sub { color: #8a8a9a; font-size: 14px; margin: 0 0 8px; }
        .kpis { display: flex; gap: 12px; flex-wrap: wrap; margin: 12px 0; }
        .kpi { background: #12101a; border: 1px solid #2a2a4e; border-radius: 12px; padding: 14px 18px; min-width: 150px; }
        .kpi b { display: block; font-size: 24px; color: #22c55e; }
        .kpi span { font-size: 12px; color: #8a8a9a; }
        table { width: 100%; border-collapse: collapse; background: #12101a; border: 1px solid #2a2a4e; border-radius: 12px; overflow: hidden; }
        th, td { text-align: left; padding: 9px 11px; font-size: 12.5px; border-bottom: 1px solid #1c1c30; }
        th { color: #8a8a9a; text-transform: uppercase; font-size: 11px; letter-spacing: .04em; }
        tr:last-child td { border-bottom: none; }
        .pill { padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; }
        .on { background: rgba(34,197,94,.15); color: #22c55e; } .off { background: rgba(255,107,107,.12); color: #ff6b6b; }
        .recibido { background: rgba(34,197,94,.15); color: #22c55e; } .enviado { background: rgba(212,175,55,.15); color: #d4af37; } .sinconf { background: rgba(138,138,154,.15); color: #8a8a9a; }
        button { background: #22c55e; color: #06210f; border: none; border-radius: 9px; padding: 6px 11px; font-weight: 700; cursor: pointer; font-size: 12px; }
        .ghost { background: #181830; color: #e9edef; border: 1px solid #2a2a4e; }
        .vacio { color: #8a8a9a; padding: 22px; text-align: center; }
        .msg { margin: 10px 0; font-size: 13px; color: #22c55e; min-height: 16px; }
        code { background: #181830; padding: 2px 6px; border-radius: 6px; font-size: 11px; color: #c9bfe0; }
    </style>
</head>
<body>
    <div class="wrap">
        <h1>Avisos — torre de control</h1>
        <p class="sub">Entrega de las últimas 24 h, suscripciones y canal por solicitud.</p>
        <div class="msg" id="msg"></div>

        <div class="kpis" id="kpis"></div>

        <h2>Suscripciones</h2>
        <table>
            <thead><tr><th>#</th><th>Usuario</th><th>Rol</th><th>Plataforma</th><th>Sol.</th><th>Estado</th><th>Último código</th><th>Motivo</th><th></th></tr></thead>
            <tbody id="subs"><tr><td colspan="9" class="vacio">Cargando…</td></tr></tbody>
        </table>

        <h2>Últimos envíos</h2>
        <table>
            <thead><tr><th>#</th><th>Evento</th><th>Susc.</th><th>Código</th><th>Estado</th><th>Enviado</th><th>Demora</th></tr></thead>
            <tbody id="envios"><tr><td colspan="7" class="vacio">—</td></tr></tbody>
        </table>

        <h2>Avisar por WhatsApp (clientes que lo eligieron)</h2>
        <div id="whatsapp"><p class="vacio">—</p></div>
    </div>

    <script>
        const msg = (t) => { document.getElementById('msg').textContent = t || ''; };
        const fecha = (s) => { if (!s) return '—'; try { return new Date(s + 'Z').toLocaleString('es-PE', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }); } catch (e) { return s; } };

        async function cargarSubs() {
            const r = await fetch('/api/v1/push/admin/suscripciones');
            const tb = document.getElementById('subs');
            if (!r.ok) { tb.innerHTML = '<tr><td colspan="9" class="vacio">No autorizado.</td></tr>'; return; }
            const rows = await r.json();
            if (!rows.length) { tb.innerHTML = '<tr><td colspan="9" class="vacio">Aún no hay suscripciones.</td></tr>'; return; }
            tb.innerHTML = rows.map(s =>
                `<tr><td>${s.id}</td><td>${s.usuario_nombre || (s.usuario_id ? ('#' + s.usuario_id) : '—')}</td>` +
                `<td>${s.rol || '—'}</td><td>${s.plataforma || '—'}</td><td>${s.solicitud_id ?? '—'}</td>` +
                `<td><span class="pill ${s.activo ? 'on' : 'off'}">${s.activo ? 'activo' : 'baja'}</span></td>` +
                `<td>${s.ultimo_codigo ?? '—'}</td><td>${s.ultimo_motivo || '—'}</td>` +
                `<td>${s.activo ? `<button data-id="${s.id}">Prueba</button>` : ''}</td></tr>`
            ).join('');
            tb.querySelectorAll('button[data-id]').forEach(b => b.onclick = () => prueba(b.dataset.id));
        }

        async function cargarMetricas() {
            const r = await fetch('/api/v1/push/admin/metricas');
            if (!r.ok) return;
            const m = await r.json();
            document.getElementById('kpis').innerHTML =
                `<div class="kpi"><b>${m.entrega_pct != null ? m.entrega_pct + '%' : '—'}</b><span>Entrega (24 h)</span></div>` +
                `<div class="kpi"><b>${m.demora_media_seg != null ? m.demora_media_seg + ' s' : '—'}</b><span>Demora media</span></div>` +
                `<div class="kpi"><b>${m.recibidos}/${m.total}</b><span>Recibidos / enviados</span></div>`;
            const tb = document.getElementById('envios');
            if (!m.envios.length) { tb.innerHTML = '<tr><td colspan="7" class="vacio">Sin envíos aún.</td></tr>'; return; }
            const cls = { 'recibido': 'recibido', 'enviado': 'enviado', 'sin confirmar': 'sinconf' };
            tb.innerHTML = m.envios.map(e =>
                `<tr><td>${e.id}</td><td>${e.tag || '—'}</td><td>${e.suscripcion_id ?? '—'}</td>` +
                `<td>${e.codigo_http ?? '—'}</td><td><span class="pill ${cls[e.estado] || 'sinconf'}">${e.estado}</span></td>` +
                `<td>${fecha(e.enviado_en)}</td><td>${e.demora_seg != null ? e.demora_seg + ' s' : '—'}</td></tr>`
            ).join('');
        }

        async function cargarWhatsApp() {
            const cont = document.getElementById('whatsapp');
            const r = await fetch('/api/v1/push/admin/whatsapp-pendientes');
            if (!r.ok) { cont.innerHTML = '<p class="vacio">—</p>'; return; }
            const d = await r.json();
            if (!d.solicitudes.length) { cont.innerHTML = '<p class="vacio">Ningún cliente eligió WhatsApp todavía.</p>'; return; }
            cont.innerHTML = d.solicitudes.map(s => {
                const tel = s.telefono ? s.telefono.replace(/\D/g, '') : '';
                const filas = Object.entries(s.textos).map(([ev, txt]) => {
                    const link = (d.numero || tel) ? `https://wa.me/${d.numero || tel}?text=${encodeURIComponent(txt)}` : '#';
                    return `<div style="display:flex;gap:8px;align-items:center;margin:4px 0"><code>${ev}</code>` +
                        `<span style="flex:1;font-size:12px;color:#c9bfe0">${txt}</span>` +
                        `<button class="ghost" onclick="navigator.clipboard&&navigator.clipboard.writeText('${txt.replace(/'/g, "\\'")}')">Copiar</button>` +
                        (link !== '#' ? `<a href="${link}" target="_blank"><button>WhatsApp</button></a>` : '') + `</div>`;
                }).join('');
                return `<div class="kpi" style="min-width:0;margin-bottom:10px"><b style="font-size:14px;color:#e9edef">Solicitud #${s.id} · ${s.estado} · ${s.telefono || 'sin teléfono'}</b>${filas}</div>`;
            }).join('');
        }

        async function prueba(id) {
            msg('Enviando…');
            try {
                const r = await fetch('/api/v1/push/admin/prueba/' + id, { method: 'POST' });
                const d = await r.json();
                msg((r.ok && d.ok) ? 'Prueba enviada ✓' : ('No se pudo enviar. ' + (d.detail || '')));
            } catch (e) { msg('Error de red.'); }
            setTimeout(() => { cargarSubs(); cargarMetricas(); }, 1200);
        }

        cargarSubs(); cargarMetricas(); cargarWhatsApp();
        setInterval(cargarMetricas, 15000);
    </script>
</body>
</html>
