<!doctype html>
<html lang="es-PE">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MITA · Avisos (admin)</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #0e0e1a; color: #e9edef; font-family: system-ui, 'Segoe UI', sans-serif; padding: 24px 16px 48px; }
        .wrap { max-width: 920px; margin: 0 auto; }
        h1 { font-size: 20px; margin: 0 0 4px; }
        .sub { color: #8a8a9a; font-size: 14px; margin: 0 0 20px; }
        table { width: 100%; border-collapse: collapse; background: #12101a; border: 1px solid #2a2a4e; border-radius: 12px; overflow: hidden; }
        th, td { text-align: left; padding: 10px 12px; font-size: 13px; border-bottom: 1px solid #1c1c30; }
        th { color: #8a8a9a; text-transform: uppercase; font-size: 11px; letter-spacing: .04em; }
        tr:last-child td { border-bottom: none; }
        .pill { padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; }
        .on { background: rgba(34,197,94,.15); color: #22c55e; } .off { background: rgba(255,107,107,.12); color: #ff6b6b; }
        button { background: #22c55e; color: #06210f; border: none; border-radius: 9px; padding: 7px 12px; font-weight: 700; cursor: pointer; font-size: 12px; }
        .vacio { color: #8a8a9a; padding: 24px; text-align: center; }
        .msg { margin: 12px 0; font-size: 13px; color: #22c55e; min-height: 16px; }
    </style>
</head>
<body>
    <div class="wrap">
        <h1>Avisos — suscripciones</h1>
        <p class="sub">Dispositivos que activaron los avisos. Envía una prueba a cualquiera.</p>
        <div class="msg" id="msg"></div>
        <table>
            <thead><tr><th>#</th><th>Rol</th><th>Plataforma</th><th>Usuario</th><th>Solicitud</th><th>Estado</th><th>Última entrega</th><th></th></tr></thead>
            <tbody id="tbody"><tr><td colspan="8" class="vacio">Cargando…</td></tr></tbody>
        </table>
    </div>
    <script>
        const tbody = document.getElementById('tbody');
        const msg = document.getElementById('msg');
        function fecha(s) { if (!s) return '—'; try { return new Date(s).toLocaleString('es-PE', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }); } catch (e) { return s; } }
        async function cargar() {
            const r = await fetch('/api/v1/push/admin/suscripciones');
            if (!r.ok) { tbody.innerHTML = '<tr><td colspan="8" class="vacio">No autorizado o error.</td></tr>'; return; }
            const rows = await r.json();
            if (!rows.length) { tbody.innerHTML = '<tr><td colspan="8" class="vacio">Aún no hay suscripciones.</td></tr>'; return; }
            tbody.innerHTML = rows.map(s =>
                `<tr><td>${s.id}</td><td>${s.rol || '—'}</td><td>${s.plataforma || '—'}</td>` +
                `<td>${s.usuario_id ?? '—'}</td><td>${s.solicitud_id ?? '—'}</td>` +
                `<td><span class="pill ${s.activo ? 'on' : 'off'}">${s.activo ? 'activo' : 'baja'}</span></td>` +
                `<td>${fecha(s.ultimo_envio_ok)}</td>` +
                `<td>${s.activo ? `<button data-id="${s.id}">Enviar prueba</button>` : ''}</td></tr>`
            ).join('');
            tbody.querySelectorAll('button[data-id]').forEach(b => b.onclick = () => prueba(b.dataset.id));
        }
        async function prueba(id) {
            msg.textContent = 'Enviando…';
            try {
                const r = await fetch('/api/v1/push/admin/prueba/' + id, { method: 'POST' });
                const d = await r.json();
                msg.textContent = (r.ok && d.ok) ? 'Prueba enviada ✓' : ('No se pudo enviar. ' + (d.detail || JSON.stringify(d.resultado || {})));
            } catch (e) { msg.textContent = 'Error de red.'; }
            cargar();
        }
        cargar();
    </script>
</body>
</html>
