<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base de conocimiento del chat — MITA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    <style>
        :root { --bg:#0e1117; --card:#161b22; --bd:#2a313c; --tx:#e6edf3; --tx2:#8b949e; --am:#FFCD11; --green:#22c55e; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:var(--bg); color:var(--tx); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
        .wrap { max-width:860px; margin:0 auto; padding:24px 18px; }
        .head { display:flex; align-items:center; gap:12px; margin-bottom:6px; }
        .head a { color:var(--tx); text-decoration:none; }
        h1 { font-size:20px; } .sub { color:var(--tx2); font-size:13px; margin-bottom:20px; }
        .item { background:var(--card); border:1px solid var(--bd); border-radius:12px; padding:16px 18px; margin-bottom:14px; }
        .item-top { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:10px; }
        .item-top b { font-size:15px; }
        textarea { width:100%; min-height:72px; background:#0d1117; border:1px solid var(--bd); border-radius:8px; color:var(--tx); padding:10px 12px; font-size:14px; resize:vertical; font-family:inherit; }
        textarea:focus { outline:none; border-color:var(--am); }
        .row { display:flex; align-items:center; gap:14px; margin-top:10px; }
        .toggle { display:flex; align-items:center; gap:8px; color:var(--tx2); font-size:13px; }
        .btn { background:var(--am); color:#000; border:none; border-radius:8px; padding:9px 16px; font-weight:600; cursor:pointer; font-size:14px; }
        .badge { font-size:11px; padding:3px 9px; border-radius:20px; }
        .b-on { background:rgba(34,197,94,.15); color:var(--green); } .b-off { background:rgba(139,148,158,.15); color:var(--tx2); }
        .msg { font-size:13px; color:var(--green); margin-left:10px; opacity:0; transition:.2s; }
        .msg.show { opacity:1; }
        .empty { color:var(--tx2); padding:24px; text-align:center; }
    </style>
</head>
<body>
<div class="wrap">
    <div class="head"><a href="/admin" title="Volver"><i class="fas fa-arrow-left"></i></a><h1><i class="fas fa-robot" style="color:var(--am)"></i> Base de conocimiento del chat</h1></div>
    <p class="sub">Lo que el asistente puede responder (precios, horarios, garantía, pagos…). Solo responderá con lo que esté <b>activo</b> y con contenido; si un dato no está, dirá que lo confirma el equipo al agendar. Nunca inventa cifras.</p>
    <p class="sub" id="actualizado" style="color:var(--green)"></p>
    <div id="lista"><div class="empty">Cargando…</div></div>
</div>
<script>
const esc = (t) => { const d=document.createElement('div'); d.textContent=t==null?'':t; return d.innerHTML; };
async function cargar() {
    const cont = document.getElementById('lista');
    let rows;
    try { const r = await fetch('/api/v1/chat-ia/conocimiento'); if(!r.ok) throw 0; rows = await r.json(); }
    catch(e){ cont.innerHTML = '<div class="empty">No autorizado o error al cargar. Inicia sesión como admin.</div>'; return; }
    if(!rows.length){ cont.innerHTML = '<div class="empty">Sin claves.</div>'; return; }
    cont.innerHTML = rows.map(r => `
        <div class="item" data-clave="${esc(r.clave)}">
            <div class="item-top">
                <b>${esc(r.titulo)}</b>
                <span class="badge ${r.activo?'b-on':'b-off'}" data-badge>${r.activo?'Activo':'Inactivo'}</span>
            </div>
            <textarea data-contenido placeholder="Escribe la respuesta que debe dar el asistente…">${esc(r.contenido)}</textarea>
            <div class="row">
                <label class="toggle"><input type="checkbox" data-activo ${r.activo?'checked':''}> Activo (el chat puede usarlo)</label>
                <button class="btn" data-guardar><i class="fas fa-floppy-disk"></i> Guardar</button>
                <span class="msg" data-msg>✓ Guardado</span>
            </div>
        </div>`).join('');
    cont.querySelectorAll('.item').forEach(it => {
        it.querySelector('[data-guardar]').addEventListener('click', () => guardar(it));
    });
}
async function guardar(it) {
    const clave = it.dataset.clave;
    const contenido = it.querySelector('[data-contenido]').value;
    const activo = it.querySelector('[data-activo]').checked;
    try {
        const r = await fetch('/api/v1/chat-ia/conocimiento/'+encodeURIComponent(clave), {
            method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ contenido, activo })
        });
        if(!r.ok) throw 0;
        const badge = it.querySelector('[data-badge]');
        badge.textContent = activo?'Activo':'Inactivo'; badge.className = 'badge '+(activo?'b-on':'b-off');
        const m = it.querySelector('[data-msg]'); m.classList.add('show'); setTimeout(()=>m.classList.remove('show'), 1800);
    } catch(e){ alert('No se pudo guardar.'); }
}
async function cargarEstado(){
    try{ const d=await (await fetch('/api/v1/chat-ia/conocimiento-bloque')).json();
        if(d.actualizado) document.getElementById('actualizado').textContent='El asistente usa la información actualizada al '+d.actualizado.replace('T',' ').slice(0,16)+'.';
    }catch(e){}
}
document.addEventListener('DOMContentLoaded', ()=>{ cargar(); cargarEstado(); });
</script>
</body>
</html>
