{# Componente reutilizable: input de dirección con Google Maps (zMita-15).
   Requiere /static/css/mita-maps.css y /static/js/mita-maps.js en la página. #}

<div class="paso-direccion" id="paso-direccion">
    <h3><i class="fas fa-map-marker-alt"></i> ¿Dónde necesitas el servicio?</h3>

    <div class="campo-form campo-direccion">
        <label for="input-direccion">Dirección *</label>
        <input type="text" id="input-direccion" class="am-input" placeholder="Escribe tu dirección (Ej: Av. Larco 123)" autocomplete="off" required>
        <div id="distrito-detectado" class="distrito-detectado" style="display:none;">
            <i class="fas fa-map-marker-alt"></i> <span id="distrito-texto"></span>
        </div>
        <div id="error-direccion" class="error-direccion"></div>
    </div>

    <div class="campo-form">
        <label for="input-referencia">Referencia (opcional)</label>
        <input type="text" id="input-referencia" class="am-input" placeholder="Ej: Casa azul, frente al parque">
    </div>

    <div id="mapa-confirmacion" class="mapa-confirmacion"></div>

    <input type="hidden" id="direccion-lat">
    <input type="hidden" id="direccion-lng">
    <input type="hidden" id="direccion-completa">
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
    if (!window.MitaMaps) return;
    MitaMaps.inicializarGoogleMaps((ok) => {
        if (!ok) return;
        // Sin select: el distrito se detecta automáticamente de la dirección
        MitaMaps.inicializarAutocomplete('input-direccion', null, 'mapa-confirmacion', (direccion) => {
            document.getElementById('direccion-lat').value = direccion.lat;
            document.getElementById('direccion-lng').value = direccion.lng;
            document.getElementById('direccion-completa').value = direccion.direccion_completa;
            const box = document.getElementById('distrito-detectado'), txt = document.getElementById('distrito-texto');
            if (txt) txt.textContent = direccion.distrito_google || '';
            if (box) box.style.display = direccion.distrito_google ? 'flex' : 'none';
            document.getElementById('mapa-confirmacion').classList.add('visible');
        });
    });
});
</script>
