<!doctype html>
<html lang="es-PE">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>MITA · Página no encontrada</title>
    <style>
        :root { color-scheme: dark; --bg: #0e0e1a; --text: #e9edef; --text2: #8a8a9a; --accent: #22c55e; }
        * { box-sizing: border-box; } html, body { overflow-x: hidden; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, 'Segoe UI', sans-serif;
            min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
        .box { max-width: 420px; width: 100%; text-align: center; }
        .cod { font-size: 72px; font-weight: 800; color: var(--accent); line-height: 1; font-variant-numeric: tabular-nums; }
        h1 { font-size: 22px; margin: 14px 0 6px; }
        p { color: var(--text2); font-size: 15px; margin: 0 0 24px; }
        a.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
            padding: 15px; border-radius: 12px; background: var(--accent); color: #06210f; font-weight: 800;
            font-size: 16px; text-decoration: none; }
        a.sec { display: inline-block; margin-top: 12px; color: var(--text2); font-size: 14px; text-decoration: none; }
    </style>
</head>
<body>
    <div class="box">
        <div class="cod">404</div>
        <h1>No encontramos esta página</h1>
        <p>El enlace puede estar roto o la página ya no existe.</p>
        <a class="btn" href="/">Volver al inicio</a>
        <a class="sec" href="/solicitar/chat">Pedir un servicio</a>
    </div>
</body>
</html>
