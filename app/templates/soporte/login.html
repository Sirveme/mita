<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soporte MITA — Ingreso</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:#0b141a; color:#e9edef; min-height:100vh; display:flex; align-items:center; justify-content:center; }
        .card { background:#111b21; border:1px solid #2a373f; border-radius:16px; padding:36px 30px; width:92%; max-width:380px; }
        .brand { text-align:center; margin-bottom:24px; }
        .brand .ic { width:56px; height:56px; border-radius:14px; background:#FFCD11; color:#000; display:flex; align-items:center; justify-content:center; font-size:26px; margin:0 auto 12px; }
        .brand h1 { font-size:20px; } .brand p { color:#8696a0; font-size:13px; margin-top:4px; }
        label { display:block; font-size:13px; color:#8696a0; margin-bottom:6px; }
        input { width:100%; padding:12px; background:#1b2b34; border:1px solid #2a373f; border-radius:8px; color:#fff; font-size:15px; }
        button { width:100%; padding:13px; background:#FFCD11; color:#000; border:none; border-radius:8px; font-weight:700; cursor:pointer; margin-top:18px; font-size:15px; }
        .error { background:rgba(239,68,68,.12); color:#ef4444; padding:10px 12px; border-radius:8px; font-size:13px; margin-bottom:16px; }
    </style>
</head>
<body>
    <form class="card" method="post" action="/soporte/login">
        <div class="brand">
            <div class="ic"><i class="fas fa-headset"></i></div>
            <h1>Panel de Soporte</h1>
            <p>Peru Sistemas Pro · MITA</p>
        </div>
        {% if error %}<div class="error"><i class="fas fa-triangle-exclamation"></i> {{ error }}</div>{% endif %}
        <label>Clave maestra</label>
        <input type="password" name="password" autofocus placeholder="••••••••">
        <button type="submit"><i class="fas fa-right-to-bracket"></i> Ingresar</button>
    </form>
</body>
</html>
