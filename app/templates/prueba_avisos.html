<!doctype html>
<html lang="es-PE">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>MITA · Prueba de avisos</title>
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body { margin: 0; background: #0e0e1a; color: #e9edef; font-family: system-ui, 'Segoe UI', sans-serif; padding: 24px 16px 48px; }
        .wrap { max-width: 520px; margin: 0 auto; }
        h1 { font-size: 20px; margin: 0 0 4px; }
        .sub { color: #8a8a9a; font-size: 14px; margin: 0 0 20px; }
        .card { background: #12101a; border: 1px solid #2a2a4e; border-radius: 16px; padding: 16px; margin-bottom: 16px; }
        .card h2 { font-size: 14px; color: #8a8a9a; margin: 0 0 12px; text-transform: uppercase; letter-spacing: .04em; }
        .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 7px 0; border-bottom: 1px solid #1c1c30; font-size: 14px; }
        .row:last-child { border-bottom: none; }
        .row b { color: #c9bfe0; font-weight: 600; }
        .val { font-weight: 600; }
        .ok { color: #22c55e; } .no { color: #ff6b6b; } .warn { color: #d4af37; }
        button { width: 100%; padding: 14px; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 10px; }
        .primary { background: #22c55e; color: #06210f; }
        .ghost { background: #181830; color: #e9edef; border: 1px solid #2a2a4e; }
        .msg { margin-top: 12px; font-size: 14px; padding: 10px 12px; border-radius: 10px; display: none; }
        .msg.show { display: block; }
        .msg.exito { background: rgba(34,197,94,.12); color: #22c55e; }
        .msg.error { background: rgba(255,107,107,.12); color: #ff6b6b; }
        .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
        .brand img { width: 40px; height: 40px; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="brand">
            <img src="/static/img/mita/icon-192.png" alt="MITA">
            <div><h1>Prueba de avisos</h1><p class="sub">Instala MITA y recibe una notificación de prueba.</p></div>
        </div>

        <div class="card">
            <h2>Diagnóstico</h2>
            <div class="row"><b>Plataforma</b><span class="val" id="d-plataforma">—</span></div>
            <div class="row"><b>Navegador</b><span class="val" id="d-navegador">—</span></div>
            <div class="row"><b>Instalada como app</b><span class="val" id="d-instalada">—</span></div>
            <div class="row"><b>Soporta avisos</b><span class="val" id="d-soporta">—</span></div>
            <div class="row"><b>Service worker activo</b><span class="val" id="d-sw">—</span></div>
            <div class="row"><b>Permiso de avisos</b><span class="val" id="d-permiso">—</span></div>
            <div class="row"><b>Suscripción guardada</b><span class="val" id="d-sub">—</span></div>
        </div>

        <div class="card">
            <h2>Acciones</h2>
            <button class="ghost" id="btn-instalar">📲 Instalar MITA</button>
            <button class="primary" id="btn-activar">🔔 Activar avisos</button>
            <button class="primary" id="btn-prueba">✉️ Enviarme un aviso de prueba</button>
            <div class="msg" id="msg"></div>
        </div>
    </div>

    <script>
        const $ = (id) => document.getElementById(id);
        function pintaBool(id, v, textoOk, textoNo) {
            const el = $(id);
            el.textContent = v ? (textoOk || 'Sí') : (textoNo || 'No');
            el.className = 'val ' + (v ? 'ok' : 'no');
        }
        function msg(texto, tipo) {
            const m = $('msg'); m.textContent = texto; m.className = 'msg show ' + (tipo || 'exito');
        }
        async function refrescar() {
            if (!window.MitaPWA) { setTimeout(refrescar, 300); return; }
            const d = await MitaPWA.diagnostico();
            $('d-plataforma').textContent = d.plataforma;
            $('d-navegador').textContent = d.navegador;
            pintaBool('d-instalada', d.instalada);
            pintaBool('d-soporta', d.soporta_push);
            pintaBool('d-sw', d.service_worker);
            const p = $('d-permiso'); p.textContent = d.permiso;
            p.className = 'val ' + (d.permiso === 'granted' ? 'ok' : (d.permiso === 'denied' ? 'no' : 'warn'));
            pintaBool('d-sub', !!d.suscripcion);
            return d;
        }
        document.addEventListener('DOMContentLoaded', () => {
            refrescar();
            $('btn-instalar').onclick = async () => {
                const r = await MitaPWA.instalar();
                if (r === 'instalada') msg('MITA ya está instalada ✓');
                else if (r === 'aceptada') msg('¡Instalada! Ábrela desde el ícono.');
                else if (r === 'guia-ios') { /* la guía ya se muestra */ }
                else if (r === 'no-disponible') msg('Tu navegador no ofrece instalación automática. En iPhone usa Compartir → Agregar a inicio.', 'error');
                setTimeout(refrescar, 800);
            };
            $('btn-activar').onclick = async () => {
                msg('Pidiendo permiso…');
                const r = await MitaPWA.activarAvisos();
                if (r.ok) msg('Avisos activados ✓');
                else if (r.motivo === 'ios-requiere-instalar') msg('En iPhone primero agrega MITA a inicio y ábrela desde el ícono.', 'error');
                else if (r.motivo === 'denegado') msg('Permiso denegado. Actívalo en Ajustes del navegador para este sitio.', 'error');
                else if (r.motivo === 'servidor-sin-vapid') msg('El servidor aún no tiene las claves de avisos (VAPID).', 'error');
                else msg('No se pudo activar: ' + r.motivo, 'error');
                setTimeout(refrescar, 600);
            };
            $('btn-prueba').onclick = async () => {
                const sub = await MitaPWA.suscripcionActual();
                if (!sub) { msg('Primero toca “Activar avisos”.', 'error'); return; }
                msg('Enviando…');
                try {
                    const resp = await fetch('/api/v1/push/prueba', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ endpoint: sub.endpoint })
                    });
                    const data = await resp.json();
                    if (resp.ok && data.ok) msg('Aviso enviado ✓ Revisa tu pantalla (o bloquea el teléfono y espera).');
                    else msg('No se pudo enviar el aviso. ' + (data.detail || ''), 'error');
                } catch (e) { msg('Error de red al enviar.', 'error'); }
            };
        });
    </script>
</body>
</html>
