<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>MITA Técnico</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="/static/css/tecnico.css">
</head>
<body>
<div class="t-wrap">
    <div class="t-header">
        <button class="menu" aria-label="Menú"><i class="fas fa-bars"></i></button>
        <div class="brand"><b>MITA Técnico</b><small id="t-nombre">—</small></div>
        <div class="actions">
            <button id="t-son" title="Sonido"><i class="fas fa-volume-high"></i></button>
            <button id="t-voz" title="Voz"><i class="fas fa-microphone"></i></button>
            <button title="Notificaciones"><i class="fas fa-bell"></i></button>
            <div class="avatar" id="t-ava">T</div>
        </div>
    </div>

    <div class="t-body">
        <!-- Toggle EN SERVICIO -->
        <div class="t-toggle-card" id="t-toggle">
            <div class="estado"><span class="dot"></span> <span id="t-estado-txt">FUERA DE SERVICIO</span></div>
            <div class="t-switch"><span class="lbl on">ON</span><span class="lbl off">OFF</span><div class="knob" id="t-knob">OFF</div></div>
        </div>

        <!-- Solicitud entrante -->
        <div id="t-entrante-cont"></div>

        <!-- Servicio activo -->
        <div class="t-sec-label"><i class="fas fa-screwdriver-wrench"></i> Servicio activo</div>
        <div id="t-activo-cont"><div class="t-vacio">Cargando...</div></div>
    </div>
</div>

<nav class="t-nav">
    <a href="/tecnico/dashboard" class="active"><i class="fas fa-house"></i><span>Inicio</span></a>
    <a href="/tecnico/servicios"><i class="fas fa-clipboard-list"></i><span>Historial</span></a>
    <a href="/tecnico/liquidaciones"><i class="fas fa-wallet"></i><span>Pagos</span></a>
    <a href="/tecnico/perfil"><i class="fas fa-user"></i><span>Perfil</span></a>
</nav>

<div class="t-toast" id="t-toast"></div>

<script src="/static/js/tecnico-sonidos.js"></script>
<script src="/static/js/tecnico-voz.js"></script>
<script src="/static/js/tecnico-dashboard.js"></script>
</body>
</html>
