<!doctype html>
<html lang="es-PE">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>MITA · Nuevo servicio disponible</title>
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body { margin: 0; background: #0e0e1a; color: #e9edef; font-family: system-ui, 'Segoe UI', sans-serif; padding: 20px 16px 40px; }
        .wrap { max-width: 460px; margin: 0 auto; }
        h1 { font-size: 20px; margin: 0 0 2px; }
        .sub { color: #8a8a9a; font-size: 13px; margin: 0 0 16px; }
        .card { background: #12101a; border: 1px solid #2a2a4e; border-radius: 16px; padding: 16px 18px; margin-bottom: 14px; }
        .fila { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid #1c1c30; font-size: 15px; }
        .fila:last-child { border-bottom: none; }
        .fila b { color: #8a8a9a; font-weight: 600; }
        .eta { text-align: center; } .eta b { font-size: 30px; color: #22c55e; display: block; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 12px; font-size: 16px; font-weight: 800; cursor: pointer; background: #22c55e; color: #06210f; margin-top: 12px; }
        .btn.sec { background: #181830; color: #e9edef; border: 1px solid #2a2a4e; font-weight: 700; }
        .btn.nav { background: #1b1830; color: #e9e3f5; border: 1px solid #8e3fc4; }
        .msg { margin-top: 12px; font-size: 15px; padding: 12px 14px; border-radius: 10px; display: none; }
        .msg.show { display: block; } .msg.exito { background: rgba(34,197,94,.12); color: #22c55e; } .msg.error { background: rgba(255,107,107,.12); color: #ff6b6b; }
        .oculto { display: none; } small { color: #8a8a9a; }
    </style>
</head>
<body>
    <div class="wrap">
        <h1>Nuevo servicio disponible</h1>
        <p class="sub" id="sub">Revisa los detalles y decide.</p>

        <div id="tomada" class="card oculto" style="border-color:#ff6b6b">Ya fue tomado por otro técnico.</div>

        <div id="detalle" class="oculto">
            <div class="card">
                <div class="fila"><b>Especialidad</b><span id="d-esp">—</span></div>
                <div class="fila"><b>Distrito</b><span id="d-dist">—</span></div>
                <div class="fila"><b>Cuándo</b><span id="d-cuando">—</span></div>
                <div class="fila"><b>Pago</b><span id="d-pago">—</span></div>
                <div class="fila"><b>Visita</b><span id="d-monto">—</span></div>
            </div>
            <div class="card"><b style="color:#8a8a9a;font-size:13px">El problema</b><p id="d-prob" style="margin:8px 0 0">—</p></div>
            <div class="card eta" id="card-eta"><span style="color:#8a8a9a;font-size:13px">Distancia estimada</span><b id="d-eta">—</b><small id="d-eta-km"></small></div>
        </div>

        <!-- Antes de aceptar -->
        <div id="pre" class="oculto">
            <button class="btn" onclick="aceptar()">Aceptar servicio</button>
            <button class="btn sec" onclick="noPuedo()">No puedo</button>
        </div>

        <!-- Después de aceptar -->
        <div id="post" class="oculto">
            <div class="card">
                <div class="fila"><b>Cliente</b><span id="p-nombre">—</span></div>
                <div class="fila"><b>Dirección</b><span id="p-dir" style="text-align:right">—</span></div>
                <div class="fila"><b>Referencia</b><span id="p-ref" style="text-align:right">—</span></div>
            </div>
            <a id="a-maps" target="_blank"><button class="btn nav">Abrir en Google Maps</button></a>
            <a id="a-waze" target="_blank"><button class="btn nav">Abrir en Waze</button></a>
            <button class="btn" onclick="irAlServicio()">Ir al servicio</button>
            <p class="sub" style="margin-top:12px">Contáctate con el cliente por el chat de MITA.</p>
        </div>

        <div class="msg" id="msg"></div>
    </div>

    <script>
        const SID = {{ solicitud_id }};
        const $ = (id) => document.getElementById(id);
        function msg(t, tipo) { const m = $('msg'); m.textContent = t; m.className = 'msg show ' + (tipo || 'exito'); }

        async function enviarUbicacion() {
            if (!navigator.geolocation) return;
            await new Promise((res) => navigator.geolocation.getCurrentPosition(async (p) => {
                try {
                    await fetch('/api/v1/tecnico/ubicacion-actual', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ lat: p.coords.latitude, lng: p.coords.longitude }) });
                } catch (e) {}
                res();
            }, () => res(), { timeout: 5000 }));
        }

        async function cargar() {
            const r = await fetch('/api/v1/tecnico/ofertas/' + SID);
            if (r.status === 401) { location.href = '/login'; return; }
            if (!r.ok) { msg('No se pudo cargar el servicio.', 'error'); return; }
            const d = await r.json();
            if (d.estado === 'tomada_por_otro') { $('tomada').classList.remove('oculto'); return; }
            $('detalle').classList.remove('oculto');
            $('d-esp').textContent = d.especialidad || '—';
            $('d-dist').textContent = d.distrito || '—';
            $('d-cuando').textContent = d.cuando || 'ahora';
            $('d-pago').textContent = d.metodo_pago || '—';
            $('d-monto').textContent = 'S/ ' + Number(d.monto_visita || 0).toFixed(2);
            $('d-prob').textContent = d.problema || '—';
            if (d.eta) { $('d-eta').textContent = '~' + d.eta.minutos + ' min'; $('d-eta-km').textContent = (d.eta.aprox ? 'aprox. ' : '') + (d.eta.metros / 1000).toFixed(1) + ' km en auto'; }
            else { $('card-eta').classList.add('oculto'); }

            if (d.aceptada_por_mi) { mostrarPost(d); }
            else { $('pre').classList.remove('oculto'); }
        }

        function mostrarPost(d) {
            $('pre').classList.add('oculto'); $('post').classList.remove('oculto');
            $('sub').textContent = 'Aceptaste el servicio.';
            $('p-nombre').textContent = d.cliente_nombre || '—';
            $('p-dir').textContent = d.direccion || '—';
            $('p-ref').textContent = d.referencia || '—';
            if (d.maps_url) $('a-maps').href = d.maps_url; else $('a-maps').style.display = 'none';
            if (d.waze_url) $('a-waze').href = d.waze_url; else $('a-waze').style.display = 'none';
        }

        async function aceptar() {
            $('pre').classList.add('oculto');
            const r = await fetch('/api/v1/tecnico/ofertas/' + SID + '/aceptar', { method: 'POST' });
            const d = await r.json().catch(() => ({}));
            if (d.estado === 'aceptada') {
                msg('¡Aceptaste el servicio!', 'exito');
                const r2 = await fetch('/api/v1/tecnico/ofertas/' + SID);   // recargar con dirección
                mostrarPost(await r2.json());
            } else {
                $('tomada').classList.remove('oculto'); $('detalle').classList.add('oculto');
            }
        }
        async function noPuedo() {
            await fetch('/api/v1/tecnico/ofertas/' + SID + '/no-puedo', { method: 'POST' }).catch(() => {});
            location.href = '/tecnico/dashboard';
        }
        function irAlServicio() { location.href = '/tecnico/servicio/' + SID; }

        (async () => { await enviarUbicacion(); await cargar(); })();
    </script>
</body>
</html>
