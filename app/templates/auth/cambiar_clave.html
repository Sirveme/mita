<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar Clave - MITA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --mita-primary: #FFCD11;
            --mita-dark: #0a0a0f;
            --mita-card: #111118;
            --mita-border: #2a2a3a;
            --mita-text: #ffffff;
            --mita-text-secondary: #888;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--mita-dark); color: var(--mita-text);
            min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .container { width: 100%; max-width: 400px; }
        .logo { text-align: center; margin-bottom: 32px; }
        .logo h1 { font-size: 48px; color: var(--mita-primary); font-weight: 800; }
        .card { background: var(--mita-card); border-radius: 16px; padding: 32px; border: 1px solid var(--mita-border); }
        .card-title { font-size: 20px; margin-bottom: 8px; text-align: center; }
        .card-subtitle { color: var(--mita-text-secondary); font-size: 14px; text-align: center; margin-bottom: 24px; }
        .alert { padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; }
        .alert-warning { background: rgba(255, 205, 17, 0.1); border: 1px solid rgba(255, 205, 17, 0.3); color: var(--mita-primary); }
        .alert-error { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); color: #ef4444; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: var(--mita-text-secondary); font-size: 14px; }
        .input-wrapper { position: relative; }
        .input-wrapper i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--mita-text-secondary); }
        .form-group input {
            width: 100%; padding: 14px 16px 14px 48px; border-radius: 10px;
            border: 1px solid var(--mita-border); background: var(--mita-dark); color: var(--mita-text); font-size: 16px;
        }
        .form-group input:focus { outline: none; border-color: var(--mita-primary); }
        .requisitos { font-size: 12px; color: var(--mita-text-secondary); margin-top: 8px; }
        .requisitos li { margin-left: 16px; margin-bottom: 4px; }
        .btn { width: 100%; padding: 14px; border-radius: 10px; border: none; background: var(--mita-primary); color: #000; font-size: 16px; font-weight: 600; cursor: pointer; transition: transform 0.2s; }
        .btn:hover { transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo"><h1>MITA</h1></div>

        <div class="card">
            <h2 class="card-title">Cambiar Clave</h2>
            <p class="card-subtitle">Por seguridad, debes cambiar tu clave de acceso</p>

            <div class="alert alert-warning">
                <i class="fas fa-exclamation-triangle"></i>
                Es tu primer ingreso. Crea una nueva clave segura.
            </div>

            {% if error %}
            <div class="alert alert-error">
                <i class="fas fa-times-circle"></i>
                {{ error }}
            </div>
            {% endif %}

            <form method="POST" action="/cambiar-clave">
                <div class="form-group">
                    <label>Nueva clave</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" name="nueva_clave" required minlength="6">
                    </div>
                    <ul class="requisitos">
                        <li>Mínimo 6 caracteres</li>
                        <li>Al menos una mayúscula</li>
                        <li>Puede incluir: números, * @ / \ #</li>
                    </ul>
                </div>

                <div class="form-group">
                    <label>Confirmar clave</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" name="confirmar_clave" required>
                    </div>
                </div>

                <button type="submit" class="btn">Guardar nueva clave</button>
            </form>
        </div>
    </div>
</body>
</html>
