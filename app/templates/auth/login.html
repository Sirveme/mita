<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar - MITA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --mita-primary: #FFCD11;
            --mita-dark: #0a0a0f;
            --mita-card: #111118;
            --mita-border: #2a2a3a;
            --mita-text: #ffffff;
            --mita-text-secondary: #888;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--mita-dark);
            color: var(--mita-text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container { width: 100%; max-width: 400px; }

        .login-logo { text-align: center; margin-bottom: 32px; }
        .login-logo h1 { font-size: 48px; color: var(--mita-primary); font-weight: 800; }
        .login-logo p { color: var(--mita-text-secondary); margin-top: 8px; }

        .login-card {
            background: var(--mita-card);
            border-radius: 16px;
            padding: 32px;
            border: 1px solid var(--mita-border);
        }

        .login-title { font-size: 24px; margin-bottom: 24px; text-align: center; }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: var(--mita-text-secondary); font-size: 14px; }

        .input-wrapper { position: relative; }
        .input-wrapper i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--mita-text-secondary); }

        .form-group input {
            width: 100%;
            padding: 14px 16px 14px 48px;
            border-radius: 10px;
            border: 1px solid var(--mita-border);
            background: var(--mita-dark);
            color: var(--mita-text);
            font-size: 16px;
            transition: border-color 0.2s;
        }
        .form-group input:focus { outline: none; border-color: var(--mita-primary); }
        .form-group input::placeholder { color: var(--mita-text-secondary); }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: none;
            background: var(--mita-primary);
            color: #000;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(255, 205, 17, 0.3); }

        .login-footer { text-align: center; margin-top: 24px; color: var(--mita-text-secondary); font-size: 14px; }
        .login-footer a { color: var(--mita-primary); text-decoration: none; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-logo">
            <h1>MITA</h1>
            <p>Servicios Técnicos a Domicilio</p>
        </div>

        <div class="login-card">
            <h2 class="login-title">Ingresar</h2>

            {% if error %}
            <div class="error-message">
                <i class="fas fa-exclamation-circle"></i>
                {{ error }}
            </div>
            {% endif %}

            <form method="POST" action="/login">
                <div class="form-group">
                    <label>DNI</label>
                    <div class="input-wrapper">
                        <i class="fas fa-id-card"></i>
                        <input type="text" name="dni" placeholder="Ingresa tu DNI"
                               maxlength="8" pattern="[0-9]{8}" required
                               inputmode="numeric">
                    </div>
                </div>

                <div class="form-group">
                    <label>Contraseña</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" name="password" placeholder="Ingresa tu contraseña" required>
                    </div>
                </div>

                <button type="submit" class="btn-login">
                    Ingresar
                </button>
            </form>

            <div class="login-footer">
                ¿Olvidaste tu contraseña? <a href="/recuperar">Recupérala aquí</a>
            </div>
        </div>
    </div>
</body>
</html>
