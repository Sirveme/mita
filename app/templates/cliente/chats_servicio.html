<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chats del servicio — MITA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="/static/css/chat.css">
</head>
<body>
<div class="c-wrap">
    <div class="c-head">
        <a class="back" href="/cliente/home"><i class="fas fa-arrow-left"></i></a>
        <div class="info"><b id="serv-num">Servicio</b><small id="serv-estado">—</small></div>
    </div>
    <div class="c-serv">
        <div class="bc" id="serv-bc">—</div>
        <div class="pr" id="serv-pr">—</div>
        <div class="estado" id="serv-badge">—</div>
    </div>
    <div id="adic-cont"></div>
    <div class="c-label">Chats</div>
    <div class="c-salas" id="salas"><div class="c-empty">Cargando...</div></div>
</div>
<div id="toast" style="position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1e2a3a;color:#fff;padding:12px 18px;border-radius:12px;font-family:Outfit,sans-serif;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:99;"></div>
<script>
const SID = {{ solicitud_id }};
function fecha(iso){ if(!iso) return ''; const d=new Date(iso); const now=new Date(); const s=Math.floor((now-d)/1000);
    if(s<60) return 'hace '+s+' seg'; if(s<3600) return 'hace '+Math.floor(s/60)+' min'; return d.toLocaleDateString('es-PE'); }
async function cargar(){
    try {
        const r = await fetch('/api/v1/solicitudes/'+SID+'/chats');
        const d = await r.json();
        const s = d.solicitud || {};
        document.getElementById('serv-num').textContent = 'Servicio #'+String(SID).padStart(5,'0');
        document.getElementById('serv-estado').textContent = s.estado || '';
        document.getElementById('serv-badge').textContent = s.estado || 'PENDIENTE';
        // Breadcrumb/problema desde el texto "[Área › Tipo] Problema — desc"
        const pr = s.problema || '';
        const m = pr.match(/^\[(.*?)\]\s*(.*)$/);
        document.getElementById('serv-bc').textContent = m ? m[1] : 'Servicio';
        document.getElementById('serv-pr').textContent = (m ? m[2] : pr).split(' — ')[0] + (s.direccion ? '' : '');
        const cont = document.getElementById('salas');
        const salas = d.salas || [];
        if(!salas.length){ cont.innerHTML='<div class="c-empty">Aún no hay chats. Se abren al asignar el técnico.</div>'; return; }
        cont.innerHTML = salas.map(sa=>`
            <a class="c-sala" href="/cliente/chat/${sa.id}">
                <div class="ic"><i class="fas ${sa.icono}"></i></div>
                <div class="body"><b>${sa.titulo}</b><p>${sa.ultimo_mensaje||'Sin mensajes aún'}</p></div>
                <div style="text-align:right;"><small style="color:var(--c-tx2);font-size:11px;">${fecha(sa.ultimo_at)}</small><br><i class="fas fa-chevron-right arrow"></i></div>
            </a>`).join('');
    } catch(e){ document.getElementById('salas').innerHTML='<div class="c-empty">No se pudo cargar.</div>'; }
}

const money = (v)=>'S/ '+(Number(v)||0).toFixed(2);
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.style.opacity=1; setTimeout(()=>t.style.opacity=0,2200); }
async function cargarAdicionales(){
    let d; try { d = await (await fetch('/api/v1/solicitudes/'+SID+'/adicionales')).json(); } catch(e){ return; }
    const cont = document.getElementById('adic-cont');
    const pend = d.pendientes || [];
    let html = '';
    if(pend.length){
        html += pend.map(a=>`
            <div style="background:#fff;border:2px solid #f59e0b;border-radius:14px;padding:16px;margin:12px 0;font-family:Outfit,sans-serif;box-shadow:0 4px 16px rgba(0,0,0,.08);">
                <div style="display:flex;align-items:center;gap:8px;color:#b45309;font-weight:700;font-size:14px;margin-bottom:6px;"><i class="fas fa-screwdriver-wrench"></i> El técnico propone un adicional</div>
                <div style="font-size:15px;color:#1e2a3a;margin-bottom:2px;">${(a.descripcion||'').replace(/</g,'&lt;')}</div>
                <div style="font-size:22px;font-weight:800;color:#1e2a3a;margin-bottom:12px;">${money(a.monto)}</div>
                <div style="display:flex;gap:10px;">
                    <button onclick="responderAdic(${a.id},true)" style="flex:1;background:#22c55e;color:#fff;border:none;border-radius:10px;padding:12px;font-weight:700;font-size:14px;cursor:pointer;"><i class="fas fa-check"></i> Aprobar</button>
                    <button onclick="responderAdic(${a.id},false)" style="flex:1;background:#fff;color:#ef4444;border:2px solid #ef4444;border-radius:10px;padding:12px;font-weight:700;font-size:14px;cursor:pointer;"><i class="fas fa-xmark"></i> Rechazar</button>
                </div>
            </div>`).join('');
    }
    // Resumen de costos (base + aprobados) siempre visible si hay algún adicional o total>base
    const adic = d.adicionales || [];
    if(adic.length || (d.total||0) > (d.base||0)){
        html += `<div style="background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:14px 16px;margin:12px 0;font-family:Outfit,sans-serif;">
            <div style="display:flex;justify-content:space-between;color:#64748b;font-size:14px;"><span>Base (visita)</span><span>${money(d.base)}</span></div>
            ${adic.filter(a=>a.estado==='APROBADO').map(a=>`<div style="display:flex;justify-content:space-between;color:#64748b;font-size:14px;margin-top:4px;"><span>+ ${(a.descripcion||'').replace(/</g,'&lt;')}</span><span>${money(a.monto)}</span></div>`).join('')}
            <div style="display:flex;justify-content:space-between;font-weight:800;color:#1e2a3a;font-size:17px;border-top:1px solid #e5e7eb;margin-top:8px;padding-top:8px;"><span>Total estimado</span><span>${money(d.total)}</span></div>
        </div>`;
    }
    cont.innerHTML = html;
}
async function responderAdic(aid, aprobado){
    try {
        const r = await fetch('/api/v1/adicionales/'+aid+'/responder',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({aprobado})});
        if(r.ok){ toast(aprobado?'Adicional aprobado':'Adicional rechazado'); cargarAdicionales(); }
        else toast('No se pudo responder');
    } catch(e){ toast('Error de conexión'); }
}
window.responderAdic = responderAdic;

function refrescar(){ cargar(); cargarAdicionales(); }
document.addEventListener('DOMContentLoaded', ()=>{ refrescar(); setInterval(refrescar, 5000); });
</script>
</body>
</html>
