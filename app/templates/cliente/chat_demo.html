{% extends "base_pwa.html" %}

{% block title %}Chat Demo - MITA{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="{{ url_for('static', path='css/chat_whatsapp.css') }}">
<style>
    .demo-page { min-height: 100vh; background: #0a0a0f; }
    .demo-header { background: #111118; padding: 14px 20px; border-bottom: 1px solid #2a2a3a; display: flex; align-items: center; justify-content: space-between; }
    .demo-header h1 { font-size: 18px; margin: 0; color: #fff; display: flex; align-items: center; gap: 10px; }
    .demo-header h1 i { color: #FFCD11; }
    .demo-badge { background: #FFCD11; color: #000; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; }
    .role-selector { display: flex; gap: 8px; padding: 12px 20px; background: #0b141a; border-bottom: 1px solid #2a2a3a; flex-wrap: wrap; }
    .role-btn { padding: 8px 14px; border-radius: 20px; border: 1px solid #2a2a3a; background: transparent; color: #8696a0; cursor: pointer; font-size: 13px; }
    .role-btn.active { background: #FFCD11; color: #000; border-color: #FFCD11; font-weight: 600; }
    .chat-shell { display: flex; flex-direction: column; height: calc(100vh - 60px - 58px); background: #0b141a; }
</style>
{% endblock %}

{% block content %}
<div class="demo-page">
    <div class="demo-header">
        <h1><i class="fas fa-comments"></i> Chat MITA</h1>
        <span class="demo-badge">DEMO</span>
    </div>

    <div class="role-selector">
        <button class="role-btn active" data-role="cliente" onclick="cambiarRol('cliente')"><i class="fas fa-user"></i> Cliente</button>
        <button class="role-btn" data-role="secretaria" onclick="cambiarRol('secretaria')"><i class="fas fa-headset"></i> Secretaria</button>
        <button class="role-btn" data-role="tecnico" onclick="cambiarRol('tecnico')"><i class="fas fa-hard-hat"></i> Técnico</button>
    </div>

    <div class="chat-shell">
        <div class="conversation-header">
            <div class="avatar"></div>
            <div class="contact-info">
                <div class="contact-name" id="chat-partner-name">Soporte MITA</div>
                <div class="contact-status">en línea</div>
            </div>
        </div>

        <div class="conversation-messages chat-bg-pattern" id="chat-messages"></div>

        <div class="conversation-input">
            <button class="icon-btn" id="btn-emoji" title="Emojis"><i class="far fa-smile"></i></button>
            <button class="icon-btn" id="btn-adjuntar" title="Adjuntar archivo"><i class="fas fa-paperclip"></i></button>
            <div class="input-wrapper">
                <textarea id="chat-input" placeholder="Escribe un mensaje…" rows="1"></textarea>
            </div>
            <button class="send-btn" id="btn-enviar" title="Enviar"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', path='js/chat.js') }}"></script>
<script>
    const ROLES = {
        cliente: { id: 1, nombre: 'Juan Pérez', partner: 'Soporte MITA' },
        secretaria: { id: 1, nombre: 'María García', partner: 'Panel de Chat' },
        tecnico: { id: 1, nombre: 'Carlos López', partner: 'Servicio #1234' }
    };
    let currentRole = 'cliente';

    function initChat() {
        const r = ROLES[currentRole];
        document.getElementById('chat-partner-name').textContent = r.partner;
        window.chat = new MitaChat({
            conversacionId: 1,
            userType: currentRole,
            userId: r.id,
            userName: r.nombre,
            demoMode: true
        });
    }

    function cambiarRol(rol) {
        currentRole = rol;
        document.querySelectorAll('.role-btn').forEach(b => b.classList.toggle('active', b.dataset.role === rol));
        initChat();
    }
    window.cambiarRol = cambiarRol;

    document.addEventListener('DOMContentLoaded', initChat);
</script>
{% endblock %}
