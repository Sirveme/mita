<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Asistente MITA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="/static/css/chat-solicitud.css?v={{ STATIC_V }}">
    <style>
        :root { --bg:#0e0e1a; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:var(--bg); color:#e9edef; font-family:'Outfit',sans-serif; min-height:100vh; }
        .cs-wrap { max-width:560px; margin:0 auto; padding:16px; min-height:100vh; display:flex; flex-direction:column; }
        .cs-head { display:flex; align-items:center; gap:12px; padding:8px 4px 16px; }
        .cs-head a { color:#e9edef; text-decoration:none; font-size:18px; }
        .cs-head b { font-size:18px; flex:1; }
        .cs-head .ia { font-size:12px; color:#22c55e; background:rgba(34,197,94,.15); padding:4px 10px; border-radius:20px; }
        #chat-container { flex:1; display:flex; flex-direction:column; }
        .chat-solicitud { min-height:auto; flex:1; }
    </style>
</head>
<body>
<div class="cs-wrap">
    <div class="cs-head">
        <a href="/" aria-label="Volver"><i class="fas fa-arrow-left"></i></a>
        <b>Asistente MITA</b>
        <span class="ia"><i class="fas fa-robot"></i> IA</span>
    </div>
    <div id="chat-container" class="chat-solicitud"></div>
</div>
<script src="/static/js/mita-voz.js?v={{ STATIC_V }}"></script>
<script src="/static/js/chat-solicitud.js?v={{ STATIC_V }}"></script>
<script>document.addEventListener('DOMContentLoaded', () => ChatSolicitud.init('chat-container'));</script>
</body>
</html>
